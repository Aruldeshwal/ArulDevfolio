<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff99"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00ffcc" flood-opacity="0.9"/>
    </filter>
    <!-- circular clip-path -->
    <clipPath id="circleMask">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
  </defs>

  <!-- circular background -->
  <circle cx="100" cy="100" r="95" fill="#050505" stroke="url(#neon)" stroke-width="2"/>

  <!-- everything inside clip -->
  <g clip-path="url(#circleMask)">
    <!-- scattered vertical text -->
    <g font-family="JetBrains Mono, monospace" font-size="6" fill="#00ff66" opacity="0.15">
      <text x="10" y="20" transform="rotate(-90 10,20)">Arul Deshwal</text>
      <text x="35" y="60" transform="rotate(-90 35,60)">Arul Deshwal</text>
      <text x="70" y="10" transform="rotate(-90 70,10)">Arul Deshwal</text>
      <text x="95" y="70" transform="rotate(-90 95,70)">Arul Deshwal</text>
      <text x="120" y="40" transform="rotate(-90 120,40)">Arul Deshwal</text>
      <text x="150" y="100" transform="rotate(-90 150,100)">Arul Deshwal</text>
      <text x="175" y="30" transform="rotate(-90 175,30)">Arul Deshwal</text>
      <text x="60" y="130" transform="rotate(-90 60,130)">Arul Deshwal</text>
      <text x="30" y="160" transform="rotate(-90 30,160)">Arul Deshwal</text>
      <text x="110" y="170" transform="rotate(-90 110,170)">Arul Deshwal</text>
    </g>

    <!-- main angular A -->
    <path d="M100 45 
             L50 160 
             H75 
             L87 130 
             H113 
             L125 160 
             H150 
             L100 45 Z"
          fill="none" 
          stroke="url(#neon)" 
          stroke-width="5" 
          stroke-linejoin="miter" 
          filter="url(#glow)" />

    <!-- inner triangle -->
    <path d="M100 80 
             L107 98 
             H93 
             L100 80 Z"
          fill="none" 
          stroke="url(#neon)" 
          stroke-width="2" 
          stroke-linejoin="round" 
          filter="url(#glow)" />

    <!-- CLI prompt -->
    <text x="55" y="178" font-family="JetBrains Mono, monospace" font-size="12" fill="#00ffcc" opacity="0.9">
      &gt;
    </text>

    <!-- cursor -->
    <rect x="68" y="170" width="10" height="12" fill="#00ffcc" opacity="0.85"/>
  </g>
</svg>
